<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil - Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0a1a3a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .hero {
    width: fit-content;      /* le cadre s'ajuste à la taille de la photo */
    max-width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 180, 255, 0.25);
  }

  .hero img {
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: 60vh;        /* la photo ne dépasse pas 60% de l'écran : les cartes restent visibles sans descendre */
    object-fit: contain;
    display: block;
  }

  .cartes {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 25px;
  }

  .carte {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 170px;
    padding: 25px;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #0d47a1, #00b4ff);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .carte:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0, 180, 255, 0.5);
  }

  .carte .icone { font-size: 2.6rem; margin-bottom: 10px; }
  .carte h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .carte p { font-size: 0.95rem; opacity: 0.9; }

  @media (max-width: 600px) {
    .cartes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- Photo d'accueil : enregistre ta photo sous le nom accueil.jpg dans le même dossier -->
  <div class="hero">
    <img src="c:\Users\PC\Desktop\mon-portefodio\image3.jpeg" alt="Bienvenue dans mon Portfolio - Génie Réseaux et Télécommunications">
  </div>

  <div class="cartes">
    <!-- Remplace portfolio.html par le nom de ta page portfolio -->
    <a class="carte" href="portfolio.html">
      <div class="icone">👤</div>
      <h2>Mon Portfolio</h2>
      <p>Profil, expérience, parcours et projets</p>
    </a>

    <a class="carte" href="portfolio.html#contact">
      <div class="icone">✉️</div>
      <h2>Me contacter</h2>
      <p>Email, numéro et WhatsApp</p>
    </a>
  </div>

</body>
</html>
